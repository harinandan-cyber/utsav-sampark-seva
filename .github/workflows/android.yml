# Builds the Android APK.
# - Every push to main: the APK is attached to the run (Actions tab → run → Artifacts).
# - Pushing a tag like v1.0: the APK is also published as a GitHub Release download.
# Optional, for a release-signed APK that can always be updated in place, add these repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx cap sync android

      - name: Decode signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/utsav-sampark-seva.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/utsav-sampark-seva.aab"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/utsav-sampark-seva.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: utsav-sampark-seva-${{ github.run_number }}
          path: |
            utsav-sampark-seva.apk
            utsav-sampark-seva.aab
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="utsav-sampark-seva.apk"
          [ -f utsav-sampark-seva.aab ] && files="$files utsav-sampark-seva.aab"
          gh release create "$GITHUB_REF_NAME" $files --title "ઉત્સવ સંપર્ક સેવા $GITHUB_REF_NAME" --notes "Android APK: ફોનમાં ડાઉનલોડ કરીને ઇન્સ્ટોલ કરો."
